<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f7f2e8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ورتل — تعلّم أحكام التجويد وصحّح تلاوتك بالذكاء الاصطناعي" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:ital@0;1&family=Amiri+Quran&family=Tajawal:wght@300;400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the persisted theme before first paint so there's no flash of the wrong palette.
      ;(function () {
        var DARK = { night: 1, royal: 1 }
        var theme = null
        try {
          theme = localStorage.getItem('wartil-theme')
        } catch (e) {}
        if (!theme) {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'ivory'
        }
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.setAttribute('data-dark', DARK[theme] ? 'true' : 'false')
      })()
    </script>
    <title>ورتل | Wartil</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
